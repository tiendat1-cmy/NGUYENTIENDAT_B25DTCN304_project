<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dăng ký tài khoản</title>
    <link rel="stylesheet" href="../css/register.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="../assets/incons/Container.svg" alt="" />
        <span class="logo_text">Rikkei <span>Cinema</span></span>
      </div>
      <div class="nav">
        <a href="./index.html">Trang chủ</a> <a href="#">Thông tin</a>
        <a href="#">Liên hệ</a> <button class="btn_header">Đăng nhập</button>
      </div>
    </header>
    <main class="hero">
      <div class="card">
        <h1 class="card__title">Tạo tài khoản mới</h1>
        <p class="card__subtitle">Đăng ký để đặt vé xem phim ngay hôm nay</p>
        <form class="form" >
          <div class="form__group">
            <label class="form__label" for="fullname">Họ và tên</label>
            <input
              class="form__input"
              type="text"
              id="fullname"
              placeholder="Nguyễn Văn A"
              autocomplete="name"
            />
            <span id="errorName" style="color: red; font-size: 12px"></span>
          </div>
          <div class="form__group">
            <label class="form__label" for="email">Email</label>
            <input
              class="form__input"
              type="text"
              id="email"
              placeholder="email@example.com"
              autocomplete="email"
            />
            <span id="errorEmail" style="color: red; font-size: 12px"></span>
          </div>
          <div class="form__group">
            <label class="form__label" for="password">Mật khẩu</label>
            <div class="form__input-wrap">
              <input
                class="form__input"
                type="password"
                id="password"
                placeholder="Nhập mật khẩu của bạn"
              />
              <button
                type="button"
                class="form__eye"
                onclick="togglePassword('password', this)"
                aria-label="Hiển thị mật khẩu"
              >
               <i class="fa-solid fa-eye-slash"></i>
              </button>
              <span
                id="errorPassword"
                style="color: red; font-size: 12px"
              ></span>
            </div>
          </div>
          <div class="form__group">
            <label class="form__label" for="confirm">Xác nhận mật khẩu</label>
            <div class="form__input-wrap">
              <input
                class="form__input"
                type="password"
                id="confirm"
                placeholder="Nhập lại mật khẩu của bạn"
              />
              <button
                type="button"
                class="form__eye"
                onclick="togglePassword('confirm', this)"
                aria-label="Hiển thị mật khẩu"
              >
              <i class="fa-solid fa-eye-slash"></i>
              </button>
              <span
                id="errorConfirm"
                style="color: red; font-size: 12px"
              ></span>
            </div>
          </div>
          <label class="form__check">
            <input type="checkbox" id="terms" />
            <span class="form__check-box"></span>
            <span class="form__check-text">
              Tôi đồng ý với
              <a href="https://www.cgv.vn/default/terms-use/" class="link-red"
                >điều khoản sử dụng</a
              >
              và chính sách bảo mật của CineEdu.
            </span>
            <span id="errorTerms" style="color: red; font-size: 12px; display:block; margin-top:4px;"></span>
          </label>
          <button class="btn-register" type="submit">Đăng ký &nbsp;→</button>
          <p class="form__login-hint">
            Đã có tài khoản?
            <a href="./login.html" class="link-red">Đăng nhập ngay</a>
          </p>
        </form>
      </div>
    </main>
    <span class="footer"> © 2026 RikkeiEdu. Tất cả quyền được bảo mật . </span>

    <!-- Đăng nhập thành công -->
    <div id="toast" class="toast hidden">
      <span class="toast__icon">✔</span>
      <div>
        <p class="toast__title">Đăng ký thành công</p>
        <p class="toast__sub">Chào mừng bạn đến với trang web của Rikkei.</p>
      </div>
      <button class="toast__close" onclick="closeToast()">✕</button>
    </div>
    <script src="../JS/register.js"></script>
  </body>
</html>
